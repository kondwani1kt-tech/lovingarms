envVarGroups:
  - name: loving-arms-env
    envVars:
      - { key: APP_NAME, value: "Loving Arms Home Care" }
      - { key: APP_ENV, value: production }
      - { key: APP_DEBUG, value: "false" }
      - { key: APP_TIMEZONE, value: America/Los_Angeles }
      - { key: APP_KEY, sync: false }
      - { key: APP_URL, sync: false }
      - { key: LOG_CHANNEL, value: stderr }
      - { key: DB_CONNECTION, value: pgsql }
      - { key: DB_PORT, value: "5432" }
      - { key: DB_SSLMODE, value: require }
      - { key: SESSION_DRIVER, value: database }
      - { key: SESSION_SECURE_COOKIE, value: "true" }
      - { key: CACHE_STORE, value: file }
      - { key: QUEUE_CONNECTION, value: sync }
      - { key: MAIL_MAILER, value: resend }
      - { key: RESEND_API_KEY, sync: false }
      - { key: MAIL_FROM_ADDRESS, sync: false }
      - { key: MAIL_FROM_NAME, value: "Loving Arms Home Care" }
      - { key: NOTIFY_EMAIL, sync: false }
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_ANON_KEY, sync: false }
      - { key: SUPABASE_SERVICE_ROLE_KEY, sync: false }

databases:
  - name: loving-arms-db
    plan: 0.1c-256mb
    postgresMajorVersion: "18"
    databaseName: lovingarms
    user: lovingarms
    ipAllowList: []

services:
  - type: web
    name: loving-arms
    runtime: docker
    plan: starter
    healthCheckPath: /up
    envVars:
      - fromGroup: loving-arms-env
      - key: DB_URL
        fromDatabase:
          name: loving-arms-db
          property: connectionString

  - type: cron
    name: loving-arms-weekly-report
    runtime: docker
    plan: starter
    schedule: "0 16 * * 1"
    dockerCommand: php artisan report:weekly
    envVars:
      - fromGroup: loving-arms-env
      - key: DB_URL
        fromDatabase:
          name: loving-arms-db
          property: connectionString
